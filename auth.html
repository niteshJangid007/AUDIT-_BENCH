<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuditBench — Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0a0a;
    --card:#161616;
    --purple:#a020f0;
    --purple2:#c026d3;
    --grey:#8a8a8a;
    --line:#2a2a2a;
    --white:#f5f5f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;max-width:400px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:40px 36px;
  }
  .logo{font-size:22px;font-weight:700;text-align:center;margin-bottom:8px;}
  .sub{font-size:13px;color:var(--grey);text-align:center;margin-bottom:32px;}
  .tabs{display:flex;background:#0d0d0d;border-radius:8px;padding:4px;margin-bottom:28px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--grey);}
  .tab.active{background:var(--purple);color:#fff;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:12px;color:var(--grey);margin-bottom:8px;}
  .field input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:#fff;font-size:14px;padding:8px 0;outline:none;
  }
  .field input:focus{border-color:var(--purple2);}
  .btn{
    width:100%;background:#fff;color:#111;border:none;border-radius:30px;
    padding:13px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;
    transition:background .2s ease, color .2s ease;
  }
  .btn:hover{background:var(--purple2);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .divider{display:flex;align-items:center;gap:12px;margin:26px 0;font-size:11px;color:var(--grey);}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .google-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:transparent;border:1px solid #444;border-radius:30px;
    padding:12px;font-size:14px;color:#fff;cursor:pointer;
  }
  .google-btn:hover{border-color:var(--purple2);color:var(--purple2);}
  .msg{font-size:12px;text-align:center;margin-top:18px;min-height:16px;}
  .msg.error{color:#ff6b6b;}
  .msg.ok{color:#4ade80;}
  .profile{display:none;text-align:center;}
  .profile img{width:64px;height:64px;border-radius:50%;margin-bottom:16px;}
  .profile h3{font-size:16px;margin-bottom:4px;}
  .profile p{font-size:13px;color:var(--grey);margin-bottom:24px;}
</style>
</head>
<body>

<div class="card">
  <div id="auth-view">
    <div class="logo">AuditBench.Org</div>
    <div class="sub">Sign in to your account</div>

    <div class="tabs">
      <div class="tab active" data-mode="login">Log in</div>
      <div class="tab" data-mode="signup">Sign up</div>
    </div>

    <form id="auth-form">
      <div class="field" id="name-field" style="display:none;">
        <label>Full name</label>
        <input type="text" id="full-name" autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn" id="submit-btn">Log in</button>
    </form>

    <div class="divider">OR</div>

    <button class="google-btn" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="profile" id="profile-view">
    <img id="profile-avatar" src="" alt="">
    <h3 id="profile-name"></h3>
    <p id="profile-email"></p>
    <button class="btn" id="logout-btn">Log out</button>
  </div>
</div>

<script>
  // ---- Supabase connection ----
  const supabase = window.supabase.createClient(
    'https://yocpmmizqnatdgekuvrp.supabase.co',
    'sb_publishable_7Kbovagkw_tDbNhjqJD5EQ_A6Vqa774'
  );

  const authView = document.getElementById('auth-view');
  const profileView = document.getElementById('profile-view');
  const form = document.getElementById('auth-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');
  const nameField = document.getElementById('name-field');
  const tabs = document.querySelectorAll('.tab');
  let mode = 'login';

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      mode = tab.dataset.mode;
      submitBtn.textContent = mode === 'login' ? 'Log in' : 'Sign up';
      nameField.style.display = mode === 'signup' ? 'block' : 'none';
      msg.textContent = '';
    });
  });

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    submitBtn.disabled = true;
    showMsg('');

    if (mode === 'signup') {
      const fullName = document.getElementById('full-name').value.trim();
      const { error } = await supabase.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } }
      });
      if (error) { showMsg(error.message, 'error'); }
      else { showMsg('Check your email to confirm your account.', 'ok'); }
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { showMsg(error.message, 'error'); }
      else { await refreshView(); }
    }
    submitBtn.disabled = false;
  });

  document.getElementById('google-btn').addEventListener('click', async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
    if (error) showMsg(error.message, 'error');
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    await refreshView();
  });

  async function refreshView(){
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      authView.style.display = 'none';
      profileView.style.display = 'block';
      document.getElementById('profile-name').textContent =
        user.user_metadata?.full_name || user.user_metadata?.name || 'Welcome';
      document.getElementById('profile-email').textContent = user.email;
      document.getElementById('profile-avatar').src =
        user.user_metadata?.avatar_url || 'https://api.dicebear.com/7.x/initials/svg?seed=' + (user.email || 'U');
    } else {
      authView.style.display = 'block';
      profileView.style.display = 'none';
    }
  }

  refreshView();
</script>

</body>
</html>
